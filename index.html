<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger Demo - VS Code</title>
    <!-- Vincula o arquivo CSS de estilos -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">
        <h1>🐯 TIGER DEVS 🐯</h1>

        <div class="painel-saldo">
            Saldo Fictício: <span id="saldo">1000</span> moedas<br>
            Aposta: <span id="valor-aposta">10</span> moedas
        </div>


        <div class="button-container">

            <button type="button" id="btn-turbo" onclick="alternarTurbo()">Turbo: DESLIGADO</button>
            <button type="button" id="btn-aposta" onclick="alterarAposta()">Aposta</button>

        </div>

        <!-- Grade de 9 slots (3x3) -->
        <div class="slots-grid">
            <div class="slot" id="slot0">🐯</div>
            <div class="slot" id="slot1">🐯</div>
            <div class="slot" id="slot2">🐯</div>

            <div class="slot" id="slot3">🐯</div>
            <div class="slot" id="slot4">🐯</div>
            <div class="slot" id="slot5">🐯</div>

            <div class="slot" id="slot6">🐯</div>
            <div class="slot" id="slot7">🐯</div>
            <div class="slot" id="slot8">🐯</div>
        </div>

        <button id="btn-girar" onclick="jogar()">GIRAR!</button>

        <div class="mensagem" id="msg">Aperte Girar para testar sua sorte!</div>
    </div>

    <!-- Vincula o arquivo JavaScript de lógica -->
    <script src="script.js"></script>
</body>

</html>
